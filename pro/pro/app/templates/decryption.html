<!DOCTYPE html>
<html>
<head>
    <title>Decryption</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f5f7;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 650px;
            margin: auto;
        }

        input, textarea {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: #2b7cff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d5fd6;
        }

        .pipeline-step {
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            background: #eee;
        }

        .done { background: #d4edda; }
        .error { background: #f8d7da; }

        img {
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>🔓 Decryption Panel</h2>

    <!-- INPUT -->
    <input type="file" id="stegoFile">
    <textarea id="metadata" placeholder="Paste metadata JSON"></textarea>

    <!-- BUTTONS -->
    <button id="decryptBtn">Decrypt</button>
    <button id="autoDecryptBtn">🤖 Auto Decrypt</button>

    <!-- PIPELINE -->
    <div id="pipeline"></div>

    <!-- OUTPUT -->
    <h3>Recovered Image</h3>
    <img id="output" width="300">
</div>

<script>

/* ================= PIPELINE FUNCTION ================= */
function step(msg, type="done") {
    const pipeline = document.getElementById("pipeline");
    const div = document.createElement("div");
    div.className = "pipeline-step " + type;
    div.innerText = msg;
    pipeline.appendChild(div);
}

/* ================= MANUAL DECRYPT ================= */
document.getElementById("decryptBtn").onclick = async () => {

    document.getElementById("pipeline").innerHTML = "";

    const file = document.getElementById("stegoFile").files[0];

    if (!file) {
        step("❌ Upload stego image", "error");
        return;
    }

    const metadata = document.getElementById("metadata").value;

    if (!metadata) {
        step("❌ Metadata required", "error");
        return;
    }

    try {
        step("📥 Reading stego image");

        const form = new FormData();
        form.append("stego_image", file);
        form.append("metadata", metadata);

        step("📡 Sending request to backend");

        const res = await fetch("/decryption/", {
            method: "POST",
            body: form
        });

        const data = await res.json();

        // 🔥 BACKEND PIPELINE STEPS
        if (data.updates) {
            data.updates.forEach(u => step(u));
        }

        if (data.status === "success") {
            step("🖼️ Rendering image");

            document.getElementById("output").src =
                "data:image/png;base64," + data.recovered_image;

            step("✅ Decryption completed");
        } else {
            step("❌ " + data.message, "error");
        }

    } catch (err) {
        step("❌ " + err.message, "error");
    }
};


/* ================= AUTO DECRYPT ================= */
document.getElementById("autoDecryptBtn").onclick = async () => {

    document.getElementById("pipeline").innerHTML = "";

    try {
        step("🤖 Auto decrypt started");

        // get encrypted image from ENCRYPTION output if available
        const stegoImg = document.getElementById("output").src;

        if (!stegoImg || stegoImg === "") {
            step("❌ No encrypted image found", "error");
            return;
        }

        const metadata = document.getElementById("metadata").value;

        if (!metadata) {
            step("❌ Metadata required", "error");
            return;
        }

        step("📦 Converting image to file");

        const response = await fetch(stegoImg);
        const blob = await response.blob();
        const file = new File([blob], "stego.png", { type: "image/png" });

        const form = new FormData();
        form.append("stego_image", file);
        form.append("metadata", metadata);

        step("📡 Sending auto request");

        const res = await fetch("/decryption/", {
            method: "POST",
            body: form
        });

        const data = await res.json();

        if (data.updates) {
            data.updates.forEach(u => step(u));
        }

        if (data.status === "success") {
            document.getElementById("output").src =
                "data:image/png;base64," + data.recovered_image;

            step("✅ Auto decryption completed");
        } else {
            step("❌ Auto decrypt failed", "error");
        }

    } catch (err) {
        step("❌ " + err.message, "error");
    }
};

</script>

</body>
</html>
